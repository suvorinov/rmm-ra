<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ settings.title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">◉</span>
        <span>{{ settings.title }}</span>
      </a>
      <nav class="nav">
        <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Хосты</a>
        <a href="/runs" class="{% if page == 'runs' %}active{% endif %}">Задачи</a>
      </nav>
      <div class="topbar-meta">
        <label class="toggle" title="Перезагружать страницу раз в минуту">
          <input type="checkbox" data-auto-refresh> авто
        </label>
        <span class="clock">{{ now|localtime('%d.%m %H:%M') }}</span>
      </div>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ settings.title }} {{ version }}</span>
    <span>снимки каждые {{ settings.snapshot_interval }} с · хранение {{ settings.retention_days }} дн · {{ tz }}</span>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
