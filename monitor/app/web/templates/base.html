<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ settings.title }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-tz="{{ settings.tz }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">◉</span>
        <span>{{ settings.title }}</span>
      </a>
      <nav class="nav">
        <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Хосты</a>
        <a href="/runs" class="{% if page == 'runs' %}active{% endif %}">Задачи</a>
      </nav>
      <div class="topbar-meta">
        <label class="toggle" title="Перезагружать страницу раз в минуту">
          <input type="checkbox" data-auto-refresh> авто
        </label>
        <span class="clock">{{ now|localtime('%d.%m %H:%M') }}</span>
      </div>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ settings.title }} {{ version }}</span>
    <span>снимки каждые {{ settings.snapshot_interval }} с · хранение {{ settings.retention_days }} дн · {{ tz }}</span>
  </footer>

  <div class="modal" id="host-modal" hidden role="dialog" aria-modal="true" aria-labelledby="host-modal-title">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" role="document">
      <div class="modal-head">
        <div>
          <h2 id="host-modal-title">Хост</h2>
          <div class="modal-sub muted" data-modal-sub></div>
        </div>
        <button class="btn btn-ghost btn-small" type="button" data-modal-close aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body" data-modal-body><p class="muted">Загрузка…</p></div>
      <div class="modal-foot">
        <a class="btn btn-ghost btn-small" data-modal-open-page href="#">Открыть карточку →</a>
        <button class="btn btn-small" type="button" data-modal-close>Закрыть</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
